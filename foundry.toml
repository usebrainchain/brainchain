[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Dynamic test linking rewrites `new` into deployCode, which ends a test at its first
# expected constructor revert. Keep it off so every case in a test runs.
dynamic_test_linking = false

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
